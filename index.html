<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Vertical TV Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .video-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background-color: #000000;
    }
    .progress-bar-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      z-index: 10;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #be7556, #4a6741);
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>

  <div class="video-container">
    <video id="player" autoplay playsinline muted loop preload="auto"></video>
    <div class="progress-bar-container">
      <div class="progress-bar" id="progress"></div>
    </div>
  </div>

  <script>
    const player = document.getElementById('player');
    const progressBar = document.getElementById('progress');

    // Força configuração de mudo para compatibilidade com políticas de autoplay de TV
    player.muted = true;
    player.defaultMuted = true;

    const urlParams = new URLSearchParams(window.location.search);
    const postId = parseInt(urlParams.get('post')) || 1;

    let retryCount = 0;
    const maxRetries = 5;

    function safePlay() {
      const playPromise = player.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          player.muted = true;
          player.play().catch(() => {});
        });
      }
    }

    player.addEventListener('canplay', () => {
      safePlay();
    });

    player.addEventListener('error', () => {
      retryCount++;
      if (retryCount <= maxRetries) {
        setTimeout(() => {
          player.load();
          safePlay();
        }, 2000);
      } else {
        setTimeout(() => {
          window.location.reload();
        }, 5000);
      }
    });

    player.addEventListener('playing', () => {
      retryCount = 0;
    });

    player.addEventListener('timeupdate', () => {
      if (player.duration) {
        const pct = (player.currentTime / player.duration) * 100;
        progressBar.style.width = pct + '%';
      }
    });

    player.addEventListener('ended', () => {
      player.currentTime = 0;
      safePlay();
    });

    async function init() {
      const cacheBuster = Date.now();
      try {
        const response = await fetch(`data.json?_=${cacheBuster}`, {
          cache: 'no-store',
          headers: {
            'Cache-Control': 'no-cache',
            'Pragma': 'no-cache'
          }
        });

        if (!response.ok) throw new Error('Falha ao carregar data.json');

        const posts = await response.json();
        const currentPost = posts.find(p => p.id === postId) || posts[0];

        if (currentPost && currentPost.video_file) {
          player.src = `${currentPost.video_file}?_=${cacheBuster}`;
          player.load();
          safePlay();
        }
      } catch (err) {
        // Fallback direto para o arquivo local numerado
        player.src = `video_${postId}.mp4?_=${cacheBuster}`;
        player.load();
        safePlay();
      }
    }

    // Inicialização segura
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
