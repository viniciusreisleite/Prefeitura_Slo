<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Mural Digital - Prefeitura de São Lourenço</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at top right, #0d2847, #061526, #020912);
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }
    .tv-container {
      display: flex;
      width: 100%;
      height: 100%;
      padding: 3vh 2.5vw;
      gap: 2.5vw;
    }

    /* Coluna de Vídeo */
    .video-section {
      flex: 0 0 35%;
      height: 100%;
      background: #000000;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 2px solid rgba(56, 189, 248, 0.45);
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background-color: #000000;
    }
    .progress-bar-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.15);
      z-index: 5;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0284c7, #38bdf8, #7dd3fc);
      transition: width 0.1s linear;
    }

    /* Coluna Informativa */
    .info-section {
      flex: 1;
      height: 100%;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 26px;
      padding: 3.5vh 3vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Cabeçalho */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 25px;
      padding-bottom: 2vh;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }
    .header-text {
      flex: 1;
    }
    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      color: #ffffff;
      font-size: clamp(0.75rem, 1vw, 1.05rem);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 6px 18px;
      border-radius: 50px;
      margin-bottom: 1vh;
      box-shadow: 0 4px 14px rgba(14, 165, 233, 0.35);
    }
    .header h1 {
      font-size: clamp(1.4rem, 2.2vw, 2.6rem);
      font-weight: 900;
      line-height: 1.2;
      color: #f8fafc;
      letter-spacing: -0.5px;
    }
    .header h1 span {
      color: #38bdf8;
    }

    .logo-img {
      height: clamp(85px, 14vh, 140px);
      max-width: 260px;
      object-fit: contain;
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.8));
    }

    /* Área de Texto Auto-Ajustável */
    .caption-container {
      flex: 1;
      margin-top: 2vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      height: 100%;
    }
    .caption-box {
      width: 100%;
      color: #ffffff;
      white-space: pre-line;
      word-break: break-word;
      line-height: 1.45;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="tv-container">
    <!-- Coluna de Vídeo -->
    <div class="video-section">
      <video id="player" autoplay playsinline muted loop preload="auto"></video>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress"></div>
      </div>
    </div>

    <!-- Coluna Informativa -->
    <div class="info-section">
      <div class="header">
        <div class="header-text">
          <span class="badge">Informa & Conecta</span>
          <h1>Prefeitura de <span>São Lourenço</span></h1>
        </div>
        <img src="logo.png" alt="Logo Prefeitura de São Lourenço" class="logo-img" onerror="this.style.display='none'">
      </div>

      <div class="caption-container" id="caption-container">
        <div class="caption-box" id="caption-text">
          Carregando informações oficiais...
        </div>
      </div>
    </div>
  </div>

  <script>
    const player = document.getElementById('player');
    const progressBar = document.getElementById('progress');
    const captionContainer = document.getElementById('caption-container');
    const captionText = document.getElementById('caption-text');

    // Reforça o mudo para garantir reprodução imediata nas Smart TVs
    player.muted = true;
    player.defaultMuted = true;

    const urlParams = new URLSearchParams(window.location.search);
    const postId = parseInt(urlParams.get('post')) || 1;

    let retryCount = 0;
    const maxRetries = 5;

    function autoFitTextExact() {
      const containerW = captionContainer.clientWidth;
      const containerH = captionContainer.clientHeight;
      
      if (!containerW || !containerH) return;

      let low = 12;
      let high = 65;
      let optimal = low;

      for (let i = 0; i < 10; i++) {
        const mid = (low + high) / 2;
        captionText.style.fontSize = mid + 'px';
        captionText.style.lineHeight = (mid * 1.35) + 'px';

        const overflowH = captionText.scrollHeight > containerH;
        const overflowW = captionText.scrollWidth > containerW;

        if (!overflowH && !overflowW) {
          optimal = mid;
          low = mid;
        } else {
          high = mid;
        }
      }

      captionText.style.fontSize = optimal + 'px';
      captionText.style.lineHeight = (optimal * 1.35) + 'px';
    }

    function safePlay() {
      const playPromise = player.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          player.muted = true;
          player.play().catch(() => {});
        });
      }
    }

    player.addEventListener('canplay', () => {
      safePlay();
    });

    player.addEventListener('error', () => {
      retryCount++;
      if (retryCount <= maxRetries) {
        setTimeout(() => {
          player.load();
          safePlay();
        }, 2000);
      } else {
        setTimeout(() => {
          window.location.reload();
        }, 5000);
      }
    });

    player.addEventListener('playing', () => {
      retryCount = 0;
    });

    player.addEventListener('timeupdate', () => {
      if (player.duration) {
        const pct = (player.currentTime / player.duration) * 100;
        progressBar.style.width = pct + '%';
      }
    });

    player.addEventListener('ended', () => {
      player.currentTime = 0;
      safePlay();
    });

    // Verificação de segurança periódica
    setInterval(() => {
      if (player.paused && player.readyState >= 2) {
        safePlay();
      }
    }, 2000);

    async function init() {
      const cacheBuster = Date.now();
      try {
        const response = await fetch(`data.json?_=${cacheBuster}`, {
          cache: 'no-store',
          headers: {
            'Cache-Control': 'no-cache',
            'Pragma': 'no-cache'
          }
        });

        if (!response.ok) throw new Error('Falha ao carregar data.json');

        const posts = await response.json();
        const currentPost = posts.find(p => p.id === postId) || posts[0];

        if (currentPost) {
          captionText.innerText = currentPost.caption || 'Prefeitura de São Lourenço - Trabalho e transparência.';
          requestAnimationFrame(autoFitTextExact);

          const videoFile = currentPost.video_file || currentPost.media_file || `video_${postId}.mp4`;
          player.src = `${videoFile}?_=${cacheBuster}`;
          player.load();
          safePlay();
        }
      } catch (err) {
        captionText.innerText = 'Prefeitura de São Lourenço - Trabalho e transparência.';
        requestAnimationFrame(autoFitTextExact);
        player.src = `video_${postId}.mp4?_=${cacheBuster}`;
        player.load();
        safePlay();
      }
    }

    window.addEventListener('resize', autoFitTextExact);

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
