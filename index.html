<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural Digital - TV</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at top right, #1e293b, #0f172a);
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }
    .tv-container {
      display: flex;
      width: 100%;
      height: 100%;
      padding: 3vh 2.5vw;
      gap: 2.5vw;
    }

    /* Coluna de Vídeo (Vertical 9:16) */
    .video-section {
      flex: 0 0 35%;
      height: 100%;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .progress-bar-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: #38bdf8;
      transition: width 0.1s linear;
    }

    /* Coluna Informativa Fixa */
    .info-section {
      flex: 1;
      height: 100%;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 3vh 2.5vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2vh;
    }
    .logo-img {
      max-height: 65px;
      max-width: 180px;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }
    .badge {
      display: inline-block;
      background: #0284c7;
      color: #fff;
      font-size: clamp(0.75rem, 1vw, 1rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 6px 14px;
      border-radius: 50px;
    }
    .header h1 {
      font-size: clamp(1.3rem, 1.8vw, 2rem);
      font-weight: 800;
      line-height: 1.2;
      color: #f8fafc;
      margin-bottom: 0.4vh;
    }
    .header .subtitle {
      font-size: clamp(0.8rem, 0.95vw, 1rem);
      color: #94a3b8;
      font-weight: 600;
    }

    /* Área do Texto Estático Sem Scroll */
    .caption-container {
      flex: 1;
      margin: 1.5vh 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      height: 100%;
    }
    .caption-box {
      width: 100%;
      color: #e2e8f0;
      white-space: pre-line;
      word-break: break-word;
      line-height: 1.45;
      font-weight: 500;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding-top: 1.5vh;
      font-size: clamp(0.8rem, 0.95vw, 1rem);
      color: #94a3b8;
    }
    .handle {
      font-weight: 700;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="tv-container">
    <div class="video-section">
      <video id="player" autoplay playsinline muted>
        <source id="video-source" src="video_1.mp4" type="video/mp4">
      </video>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress"></div>
      </div>
    </div>

    <div class="info-section">
      <div class="header">
        <div class="header-top">
          <span class="badge" id="post-badge">Informativo</span>
          <img src="logo.png" alt="Logo Prefeitura" class="logo-img" onerror="this.style.display='none'">
        </div>
        <h1>Prefeitura Municipal de São Lourenço</h1>
        <p class="subtitle" id="post-date">Atualizado recentemente</p>
      </div>

      <div class="caption-container" id="caption-container">
        <div class="caption-box" id="caption-text">
          Carregando informações...
        </div>
      </div>

      <div class="footer">
        <div>Acompanhe: <span class="handle">@prefeituraslmg</span></div>
        <div id="status-tag">🔴 Em Exibição</div>
      </div>
    </div>
  </div>

  <script>
    const player = document.getElementById('player');
    const videoSource = document.getElementById('video-source');
    const progressBar = document.getElementById('progress');
    const captionContainer = document.getElementById('caption-container');
    const captionText = document.getElementById('caption-text');
    const postDate = document.getElementById('post-date');
    const postBadge = document.getElementById('post-badge');

    const urlParams = new URLSearchParams(window.location.search);
    const postId = parseInt(urlParams.get('post')) || 1;

    // Algoritmo de Busca Binária para achar a fonte exata que preenche o container
    function autoFitTextExact() {
      const containerW = captionContainer.clientWidth;
      const containerH = captionContainer.clientHeight;
      
      if (!containerW || !containerH) return;

      let low = 8;     // Tamanho mínimo (px)
      let high = 60;   // Tamanho máximo (px)
      let optimal = low;

      // Executa 10 iterações de aproximação
      for (let i = 0; i < 10; i++) {
        const mid = (low + high) / 2;
        captionText.style.fontSize = mid + 'px';
        captionText.style.lineHeight = (mid * 1.35) + 'px';

        // Verifica se ultrapassa tanto em altura quanto em largura
        const overflowH = captionText.scrollHeight > containerH;
        const overflowW = captionText.scrollWidth > containerW;

        if (!overflowH && !overflowW) {
          optimal = mid;
          low = mid; // Pode tentar uma fonte maior
        } else {
          high = mid; // Precisa de uma fonte menor
        }
      }

      captionText.style.fontSize = optimal + 'px';
      captionText.style.lineHeight = (optimal * 1.35) + 'px';
    }

    async function loadPostData() {
      try {
        const res = await fetch('data.json?t=' + new Date().getTime());
        const posts = await res.json();
        
        const currentPost = posts.find(p => p.id === postId) || posts[0];
        
        captionText.innerText = currentPost.caption;
        postDate.innerText = 'Publicado em ' + currentPost.updated_at;
        postBadge.innerText = `Informativo #${postId}`;

        // Espera renderizar e ajusta o tamanho exato da fonte
        requestAnimationFrame(() => {
          autoFitTextExact();
        });

        videoSource.src = currentPost.video_file;
        player.load();
        player.play().catch(e => console.log('Autoplay:', e));
      } catch (e) {
        console.log('Erro ao carregar dados:', e);
      }
    }

    window.addEventListener('resize', autoFitTextExact);

    // Barra de progresso do vídeo
    player.addEventListener('timeupdate', () => {
      if (player.duration) {
        const pct = (player.currentTime / player.duration) * 100;
        progressBar.style.width = pct + '%';
      }
    });

    player.addEventListener('ended', () => {
      player.currentTime = 0;
      player.play();
    });

    loadPostData();
  </script>
</body>
</html>
