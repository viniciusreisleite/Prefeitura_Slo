name: Sincronizar Instagram com Painel de TV

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar FFmpeg, dependências e Navegador
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install playwright yt-dlp
          playwright install chromium --with-deps

      - name: Baixar vídeo e legenda do Instagram
        env:
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
        run: |
          python sync_instagram.py

      - name: Salvar arquivos no repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.mp4 data.json last_video.txt index.html
          git diff-index --quiet HEAD || git commit -m "Atualizado vídeo e dados da TV [skip ci]"
          git push

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar Painel na Web
        uses: actions/deploy-pages@v4
