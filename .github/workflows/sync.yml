name: Sincronizar Instagram com GitHub Releases

on:
  schedule:
    # Executa a cada 6 horas automaticamente
    - cron: '0 */6 * * *'
  # Permite rodar manualmente pelo painel
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências e Navegador
        run: |
          pip install playwright requests
          playwright install chromium --with-deps

      - name: Baixar vídeo do Instagram
        env:
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
        run: |
          python sync_instagram.py

      - name: Publicar vídeo no GitHub Releases
        uses: softprops/action-gh-release@v2
        if: hashFiles('*.mp4') != ''
        with:
          tag_name: video-${{ github.run_number }}
          name: "Novo Vídeo Instagram - ${{ github.run_number }}"
          files: "*.mp4"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
